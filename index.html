<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест Отчетов | Garry's Mod</title>
<style>
body { font-family: sans-serif; background: #0b0e14; color: #fff; padding: 20px; }
.container { max-width: 800px; margin: 0 auto; }
.report-card { background: #161b22; border: 1px solid #232a36; border-radius: 8px; padding: 20px; margin-bottom: 15px; border-left: 4px solid #ff9f43; }
.report-card h3 { color: #4facfe; margin-bottom: 10px; }
.report-card p { font-size: 14px; color: #c9d1d9; margin-bottom: 5px; }
.report-card b { color: #fff; }
.btn { padding: 10px 20px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-right: 10px; }
.btn-red { background: #ef4444; }
.btn-green { background: #22c55e; color: #000; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
.modal-overlay.open { display: flex; }
.modal { background: #161b22; border: 1px solid #232a36; border-radius: 12px; padding: 30px; width: 100%; max-width: 500px; }
.modal h2 { color: #fff; margin-bottom: 20px; }
.modal label { display: block; font-size: 12px; color: #8b96ab; margin-top: 10px; margin-bottom: 5px; }
.modal input, .modal textarea, .modal select { width: 100%; padding: 10px; background: #0b0e14; border: 1px solid #2a3241; border-radius: 8px; color: #fff; font-family: inherit; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
.img-preview { max-width: 200px; border-radius: 8px; margin-top: 10px; }
</style>
</head>
<body>

<div class="container">
    <h1>ТЕСТ ОТЧЕТОВ</h1>
    <p>Напиши отчет, и он должен остаться на экране.</p>
    
    <div style="margin: 20px 0;">
        <button class="btn" onclick="openForm()">Написать отчет</button>
    </div>

    <h2>Отчеты:</h2>
    <div id="pending-list"><p>Загрузка...</p></div>
</div>

<!-- Модалка -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2>Новый отчет</h2>
        <form id="reportForm">
            <label>Ник админа</label>
            <input type="text" name="adminNick" required>
            <label>SteamID</label>
            <input type="text" name="steamId" required>
            <label>Ранг</label>
            <input type="text" name="rank" required>
            <label>Время</label>
            <input type="text" name="time" required>
            <label>Нарушение</label>
            <textarea name="rule"></textarea>
            <label>Сомнительные действия</label>
            <textarea name="suspicious"></textarea>
            <label>Продолжать?</label>
            <textarea name="continue"></textarea>
            <label>Скриншот (до 1 МБ)</label>
            <input type="file" id="reportImage" accept="image/*">
            
            <div class="modal-actions">
                <button type="button" class="btn-red" onclick="closeForm()">Отмена</button>
                <button type="submit" class="btn-green">Отправить</button>
            </div>
        </form>
    </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase = createClient('https://gqmrwtcztqluaqltuhss.supabase.co', 'sb_publishable_FyFuciAgrbhv4qNvhjqWwg_PgFMa50g');

// 1. Открыть форму
window.openForm = () => {
    document.getElementById('modal').classList.add('open');
    document.getElementById('reportForm').reset();
};

// 2. Закрыть форму
window.closeForm = () => {
    document.getElementById('modal').classList.remove('open');
};

// 3. Отправка
document.getElementById('reportForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const fileInput = document.getElementById('reportImage');
    
    // Функция для сохранения
    const saveReport = async (imageData) => {
        const data = {
            type: 'adm',
            reporter: 'Дед в чешках', // Хардкод для теста
            adminNick: f.adminNick.value,
            steamId: f.steamId.value,
            rank: f.rank.value,
            time: f.time.value,
            rule: f.rule.value || '—',
            suspicious: f.suspicious.value || '—',
            continue: f.continue.value || '—',
            status: 'pending',
            date: new Date().toLocaleString('ru-RU'),
            image: imageData
        };

        // ВОТ ТУТ МЫ ЛОВИМ ОШИБКУ
        const { data: result, error } = await supabase.rpc('insert_report_direct', {
    p_type: data.type,
    p_reporter: data.reporter,
    p_adminNick: data.adminNick,
    p_steamId: data.steamId,
    p_rank: data.rank,
    p_time: data.time,
    p_rule: data.rule,
    p_suspicious: data.suspicious,
    p_continue: data.continue,
    p_image: data.image
});

        if (error) {
            // Если база не приняла - показываем причину
            alert("ОШИБКА БАЗЫ ДАННЫХ:\n" + error.message + "\nКод: " + error.code);
            return;
        }

        // Если всё ок - добавляем на экран
        const pendingList = document.getElementById('pending-list');
        const newHtml = `
            <div class="report-card" style="border-left-color: #22c55e;">
                <h3>Слежка за админом (Только что)</h3>
                <p><b>Автор:</b> ${data.reporter}</p>
                <p><b>Нарушитель:</b> ${data.adminNick} (${data.steamId})</p>
                <p><b>Время:</b> ${data.time}</p>
                ${data.image ? `<img src="${data.image}" class="img-preview">` : ''}
            </div>
        `;
        if(pendingList.innerHTML.includes('Загрузка')) pendingList.innerHTML = '';
        pendingList.innerHTML = newHtml + pendingList.innerHTML;

        alert("УСПЕХ! Отчет записан в базу.");
        closeForm();
    };

    // Обработка картинки
    if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        if (file.size > 1024 * 1024) return alert("Файл больше 1 МБ!");
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = 600;
                canvas.height = img.height * (600 / img.width);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                saveReport(canvas.toDataURL('image/jpeg', 0.6));
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    } else {
        saveReport(null);
    }
});

// 4. Загрузка при старте (только чтение)
async function loadReports() {
    const { data: reports, error } = await supabase.from('reports').select('*').eq('status', 'pending');
    
    if (error) {
        document.getElementById('pending-list').innerHTML = `<p style="color:red;">Ошибка загрузки: ${error.message}</p>`;
        return;
    }

    if (!reports || reports.length === 0) {
        document.getElementById('pending-list').innerHTML = '<p>Нет отчетов.</p>';
        return;
    }

    document.getElementById('pending-list').innerHTML = reports.map(r => `
        <div class="report-card">
            <h3>${r.type === 'adm' ? 'Слежка за админом' : 'Слежка по указаниям'}</h3>
            <p><b>Автор:</b> ${r.reporter} • ${r.date}</p>
            <p><b>Нарушитель:</b> ${r.adminNick} (${r.steamId})</p>
            <p><b>Время:</b> ${r.time} | <b>Нарушение:</b> ${r.rule}</p>
            ${r.image ? `<img src="${r.image}" class="img-preview">` : ''}
        </div>
    `).join('');
}

loadReports();
</script>
</body>
</html>
